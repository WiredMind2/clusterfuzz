# Optional background LLM-assisted deep-fuzz worker.
# Requires an LLM provider (Ollama on :11434 by default, or OpenRouter) and shared data/.
#
#   docker compose -f docker-compose.yml -f docker-compose.llm-worker.yml up -d --build llm-fuzz-worker
#
# Optional: set GITHUB_TOKEN / OPENROUTER_API_KEY in llm-worker.env for comments / OpenRouter.

services:
  llm-fuzz-worker:
    build:
      context: .
      dockerfile: Dockerfile.llm-worker
    image: clusterfuzz-llm-worker:local
    container_name: clusterfuzz-llm-fuzz-worker
    network_mode: host
    restart: unless-stopped
    working_dir: /opt/clusterfuzz/deploy
    env_file:
      - llm-worker.env
    environment:
      LLM_FUZZ_QUEUE_DIR: /data/llm_fuzz_queue
      LLM_FUZZ_DEPLOY_DIR: /opt/clusterfuzz/deploy
      LLM_FUZZ_PROVIDER: ${LLM_FUZZ_PROVIDER:-ollama}
      LLM_FUZZ_BASE_URL: ${LLM_FUZZ_BASE_URL:-http://127.0.0.1:11434}
      LLM_FUZZ_MODEL: ${LLM_FUZZ_MODEL:-Qwen2.5-Coder:1.5b}
      LLM_FUZZ_BG_SECONDS: ${LLM_FUZZ_BG_SECONDS:-600}
      LLM_FUZZ_BG_MAX_SEEDS: ${LLM_FUZZ_BG_MAX_SEEDS:-128}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOCAL_GCS_ROOT: /data/local_gcs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../data:/data
      - .:/opt/clusterfuzz/deploy:ro
      - /tmp/runner:/tmp/runner
    # Soft CPU throttle via compose (Docker cpus)
    cpus: 1.5
    mem_limit: 2g
