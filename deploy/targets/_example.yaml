# Template for onboarding another repo. Prefer:
#   ./scripts/cf_enable_repo.sh OWNER/REPO
# which writes deploy/targets/<id>.yaml and opens an enablement PR.
id: example-repo
github: OWNER/REPO
engine: atheris # atheris | libfuzzer
fuzz_seconds: 60
harnesses:
  - fuzz/example_fuzzer.py
ui_url: http://127.0.0.1:9300
notes: Enabled via central repository_dispatch to WiredMind2/clusterfuzz (see docs/multi-repo.md)
