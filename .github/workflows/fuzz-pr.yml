# Same-repo PR fuzz for WiredMind2/clusterfuzz (calls reusable job).

name: ClusterFuzz PR fuzz

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  fuzz:
    uses: ./.github/workflows/fuzz-pr-reusable.yml
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CLUSTERFUZZ_CROSS_REPO_TOKEN }}
    with:
      target_repository: ${{ github.repository }}
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      cross_repo: "0"
