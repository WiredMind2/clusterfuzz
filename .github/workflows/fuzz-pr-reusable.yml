# Reusable ClusterFuzz PR fuzz job (called from fuzz-pr.yml or fuzz-dispatch.yml).
# Runs on self-hosted labels: self-hosted, linux, clusterfuzz-local
#
# Inputs allow cross-repo runs (central dispatch for personal accounts / multi-repo).

name: ClusterFuzz PR fuzz (reusable)

on:
  workflow_call:
    inputs:
      target_repository:
        description: OWNER/REPO to fuzz (default = caller repository)
        type: string
        required: false
        default: ""
      pr_number:
        description: Pull request number for comments
        type: string
        required: false
        default: ""
      checkout_ref:
        description: Git ref/SHA to checkout
        type: string
        required: false
        default: ""
      fuzz_engine:
        description: atheris | libfuzzer (empty = vars / auto)
        type: string
        required: false
        default: ""
      target_id:
        description: TARGET_ID override
        type: string
        required: false
        default: ""
      cross_repo:
        description: "1" when fuzzing a repo other than WiredMind2/clusterfuzz
        type: string
        required: false
        default: "0"
    secrets:
      CROSS_REPO_TOKEN:
        description: PAT for cross-repo checkout + PR comments (optional if same-repo)
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fuzz:
    runs-on: [self-hosted, clusterfuzz-local]
    timeout-minutes: 30

    env:
      FUZZ_ENGINE: ${{ inputs.fuzz_engine || vars.FUZZ_ENGINE || 'libfuzzer' }}
      FUZZ_SECONDS: ${{ vars.FUZZ_SECONDS || '60' }}
      CLUSTERFUZZ_UI_URL: ${{ vars.CLUSTERFUZZ_UI_URL || 'http://127.0.0.1:9300' }}
      TARGET_ID: ${{ inputs.target_id || vars.TARGET_ID || 'unknown' }}
      LOCAL_GCS_ROOT: ${{ vars.LOCAL_GCS_ROOT || '/data/local_gcs' }}
      ATHERIS_HARNESSES: ${{ vars.ATHERIS_HARNESSES || '' }}
      SKIP_INGEST: ${{ vars.SKIP_INGEST || '' }}
      ARTIFACT_DIR: ${{ github.workspace }}/fuzz-artifacts
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://127.0.0.1:4318' }}
      OTEL_SERVICE_NAME: clusterfuzz-pr-fuzz
      LLM_FUZZ_ENABLED: ${{ vars.LLM_FUZZ_ENABLED || '1' }}
      LLM_FUZZ_BASE_URL: ${{ vars.LLM_FUZZ_BASE_URL || 'http://127.0.0.1:11434' }}
      LLM_FUZZ_MODEL: ${{ vars.LLM_FUZZ_MODEL || 'Qwen2.5-Coder:1.5b' }}
      LLM_FUZZ_TIMEOUT_S: ${{ vars.LLM_FUZZ_TIMEOUT_S || '45' }}
      LLM_FUZZ_BG_ENABLED: ${{ vars.LLM_FUZZ_BG_ENABLED || '1' }}
      LLM_FUZZ_QUEUE_DIR: ${{ vars.LLM_FUZZ_QUEUE_DIR || '/data/llm_fuzz_queue' }}
      TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      CROSS_REPO: ${{ inputs.cross_repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Locate ClusterFuzz deploy glue
        id: glue
        run: |
          set -euo pipefail
          for candidate in \
              "${GITHUB_WORKSPACE}/deploy" \
              "/opt/clusterfuzz/deploy" \
              "/clusterfuzz/deploy"; do
            if [[ -x "${candidate}/scripts/run_timed_fuzz.sh" ]] \
               || [[ -x "${candidate}/scripts/run_timed_atheris.sh" ]]; then
              echo "deploy=${candidate}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "error: deploy/ scripts not found (mount deploy into the runner or vendor it)" >&2
          exit 1

      - name: Auto-detect fuzz engine
        id: detect
        run: |
          set -euo pipefail
          ENGINE="${FUZZ_ENGINE}"
          if [[ "${ENGINE}" == "auto" || -z "${ENGINE}" ]]; then
            if find . -type f \( -path './fuzz/*_fuzzer.py' -o -path './fuzz/**/*_fuzzer.py' \) 2>/dev/null | grep -q .; then
              ENGINE=atheris
            elif [[ -x fuzz/build.sh ]] || grep -Rsl 'LLVMFuzzerTestOneInput' \
                --include='*.c' --include='*.cc' --include='*.cpp' . 2>/dev/null | head -1 | grep -q .; then
              ENGINE=libfuzzer
            elif [[ -x deploy/demo-target/build.sh ]]; then
              ENGINE=libfuzzer
            else
              ENGINE=libfuzzer
            fi
          fi
          echo "engine=${ENGINE}" >> "$GITHUB_OUTPUT"
          echo "FUZZ_ENGINE=${ENGINE}" >> "$GITHUB_ENV"
          echo "==> Using FUZZ_ENGINE=${ENGINE}"

      - name: Setup libFuzzer toolchain
        if: env.FUZZ_ENGINE == 'libfuzzer'
        run: |
          set -euo pipefail
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang llvm libclang-rt-18-dev zip python3 unzip
          fi

      - name: Build libFuzzer target
        if: env.FUZZ_ENGINE == 'libfuzzer'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          if [[ -x "${GITHUB_WORKSPACE}/fuzz/build.sh" ]]; then
            OUT_DIR="${GITHUB_WORKSPACE}/fuzz/out" "${GITHUB_WORKSPACE}/fuzz/build.sh" "${{ github.run_number }}"
            BIN="$(find "${GITHUB_WORKSPACE}/fuzz/out" -type f -executable ! -name '*.sh' | head -1)"
            ZIP="$(ls -1 "${GITHUB_WORKSPACE}/fuzz/out"/*-[0-9]*.zip 2>/dev/null | tail -1 || true)"
            echo "BINARY=${BIN}" >> "$GITHUB_ENV"
            echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
            mapfile -t SRC < <(find fuzz -type f \( -name '*.cc' -o -name '*.cpp' -o -name '*.c' \) | head -5)
            echo "SOURCE_PATHS=${SRC[*]}" >> "$GITHUB_ENV"
          elif [[ -x "${GITHUB_WORKSPACE}/deploy/demo-target/build.sh" ]]; then
            "${GITHUB_WORKSPACE}/deploy/demo-target/build.sh" "${{ github.run_number }}"
            echo "BINARY=${GITHUB_WORKSPACE}/deploy/demo-target/out/demo-fuzz" >> "$GITHUB_ENV"
            echo "ZIP=$(ls -1 ${GITHUB_WORKSPACE}/deploy/demo-target/out/demo-fuzz-*.zip | tail -1)" >> "$GITHUB_ENV"
            echo "SOURCE_PATHS=${GITHUB_WORKSPACE}/deploy/demo-target/demo_fuzz.cc" >> "$GITHUB_ENV"
          elif [[ "${TARGET_ID}" == "clusterfuzz-demo" && -x "${DEPLOY}/demo-target/build.sh" ]]; then
            OUT_DIR="${GITHUB_WORKSPACE}/out" "${DEPLOY}/demo-target/build.sh" "${{ github.run_number }}"
            echo "BINARY=${GITHUB_WORKSPACE}/out/demo-fuzz" >> "$GITHUB_ENV"
            echo "ZIP=$(ls -1 ${GITHUB_WORKSPACE}/out/demo-fuzz-*.zip | tail -1)" >> "$GITHUB_ENV"
            echo "SOURCE_PATHS=${DEPLOY}/demo-target/demo_fuzz.cc" >> "$GITHUB_ENV"
          else
            echo "error: no fuzz/build.sh (or demo-target) found — run cf_enable_repo.sh --scaffold" >&2
            exit 1
          fi

      - name: Setup Atheris
        if: env.FUZZ_ENGINE == 'atheris'
        run: |
          set -euo pipefail
          python3 -m venv "${GITHUB_WORKSPACE}/.venv-fuzz"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/.venv-fuzz/bin/activate"
          python -m pip install --upgrade pip
          if [[ -f fuzz/requirements.txt ]]; then
            python -m pip install -r fuzz/requirements.txt
          else
            python -m pip install atheris
          fi
          if [[ -f pyproject.toml ]] || [[ -f setup.py ]]; then
            python -m pip install -e . || true
          fi
          echo "PYTHON=${GITHUB_WORKSPACE}/.venv-fuzz/bin/python" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/.venv-fuzz/bin" >> "$GITHUB_PATH"
          if [[ -n "${ATHERIS_HARNESSES}" ]]; then
            # shellcheck disable=SC2086
            echo "SOURCE_PATHS=${ATHERIS_HARNESSES}" >> "$GITHUB_ENV"
          else
            mapfile -t H < <(find fuzz -type f -name '*_fuzzer.py' | sort)
            echo "SOURCE_PATHS=${H[*]}" >> "$GITHUB_ENV"
          fi

      - name: LLM prepare seeds and dictionary
        if: env.LLM_FUZZ_ENABLED == '1'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          mkdir -p "${ARTIFACT_DIR}"
          # shellcheck disable=SC2086
          python3 "${DEPLOY}/scripts/llm_fuzz_prepare.py" --github-env ${SOURCE_PATHS:-}

      - name: Timed libFuzzer
        if: env.FUZZ_ENGINE == 'libfuzzer'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          "${DEPLOY}/scripts/run_timed_fuzz.sh" "${BINARY}" "${FUZZ_SECONDS}" "${ARTIFACT_DIR}"

      - name: Ingest build into local_gcs
        if: env.FUZZ_ENGINE == 'libfuzzer' && env.SKIP_INGEST != '1'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          if [[ -z "${ZIP:-}" || ! -f "${ZIP}" ]]; then
            echo "==> skip ingest (no revisioned zip)"
            exit 0
          fi
          LOCAL_GCS_ROOT="${LOCAL_GCS_ROOT}" \
            "${DEPLOY}/scripts/ingest_build.sh" "${ZIP}"

      - name: Timed Atheris
        if: env.FUZZ_ENGINE == 'atheris'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          mkdir -p "${ARTIFACT_DIR}"
          mapfile -t HARNESSES < <(
            if [[ -n "${ATHERIS_HARNESSES}" ]]; then
              # shellcheck disable=SC2086
              printf '%s\n' ${ATHERIS_HARNESSES}
            else
              find fuzz -type f -name '*_fuzzer.py' | sort
            fi
          )
          if [[ ${#HARNESSES[@]} -eq 0 ]]; then
            echo "error: no Atheris harnesses found (set ATHERIS_HARNESSES or add fuzz/*_fuzzer.py)" >&2
            exit 1
          fi
          PER=$(( FUZZ_SECONDS / ${#HARNESSES[@]} ))
          if [[ "${PER}" -lt 5 ]]; then PER=5; fi
          export PYTHON="${PYTHON:-${GITHUB_WORKSPACE}/.venv-fuzz/bin/python}"
          for h in "${HARNESSES[@]}"; do
            echo "==> Harness ${h} (${PER}s)"
            "${DEPLOY}/scripts/run_timed_atheris.sh" "${h}" "${PER}" "${ARTIFACT_DIR}"
          done

      - name: LLM crash triage
        if: always() && env.LLM_FUZZ_ENABLED == '1'
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          python3 "${DEPLOY}/scripts/llm_crash_triage.py" || true

      - name: Post PR review comments
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          CLUSTERFUZZ_UI_URL: ${{ env.CLUSTERFUZZ_UI_URL }}
          FUZZ_ENGINE: ${{ env.FUZZ_ENGINE }}
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "==> skip comments (no PR number)"
            exit 0
          fi
          python3 "${DEPLOY}/scripts/post_pr_comments.py"

      - name: Enqueue background LLM deep-fuzz
        if: always() && env.LLM_FUZZ_BG_ENABLED == '1'
        env:
          GITHUB_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          GITHUB_SHA: ${{ inputs.checkout_ref || github.sha }}
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          python3 "${DEPLOY}/scripts/llm_fuzz_enqueue.py" || true

      - name: Report OTLP (best-effort)
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          FUZZ_ENGINE: ${{ env.FUZZ_ENGINE }}
          FUZZ_SECONDS: ${{ env.FUZZ_SECONDS }}
          TARGET_ID: ${{ env.TARGET_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ env.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ env.OTEL_SERVICE_NAME }}
        run: |
          set -euo pipefail
          DEPLOY="${{ steps.glue.outputs.deploy }}"
          python3 "${DEPLOY}/scripts/report_fuzz_otel.py" || true

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ env.TARGET_ID }}-pr-${{ env.PR_NUMBER }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: ignore
